<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe Toolbelt — Privacy-first developer tools</title>
  <meta name="description" content="Developer utilities that run entirely in your browser: formatters, encoders, crypto, media and more. Your data stays on your device." />
  <meta name="theme-color" content="#110f18" />
  <!-- Static tags for link previews (scrapers don't run JavaScript). The build writes a
       copy of this page per route with that tool's title and description (vite.config.js). -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Vibe Toolbelt" />
  <meta property="og:title" content="Vibe Toolbelt — Privacy-first developer tools" />
  <meta property="og:description" content="Developer utilities that run entirely in your browser: formatters, encoders, crypto, media and more." />
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- Applies the saved theme and accent before first paint. A file rather than an
       inline script, so the Content-Security-Policy doesn't have to allow inline scripts. -->
  <script src="/theme-init.js"></script>
</head>

<body>
  <noscript>Vibe Toolbelt needs JavaScript: every tool runs locally in your browser.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
